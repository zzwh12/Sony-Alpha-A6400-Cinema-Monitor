name: 构建 iOS 安装包

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: 编译 CinemaHUD iOS 版
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec iOS/project.yml

      - name: 配置签名（如已设置密钥）
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$PROVISIONING_PROFILE_BASE64" || -z "$APPLE_TEAM_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "签名密钥未完整设置，将生成未签名 IPA。"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/cinemahud-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/cinemahud.mobileprovision"
          DECODED_PROFILE_PATH="$RUNNER_TEMP/cinemahud-profile.plist"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db" /Library/Keychains/System.keychain

          security cms -D -i "$PROFILE_PATH" > "$DECODED_PROFILE_PATH"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$DECODED_PROFILE_PATH")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: 归档并导出签名 IPA
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/CinemaHUDMobile.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ipa-export"
          OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -project iOS/CinemaHUDMobile.xcodeproj \
            -scheme CinemaHUDMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          cat > "$OPTIONS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.shivvyas.cinemahud.mobile</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$OPTIONS_PATH"
          cp "$EXPORT_PATH/CinemaHUDMobile.ipa" "$GITHUB_WORKSPACE/CinemaHUDMobile.ipa"

      - name: 编译并打包未签名 IPA
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project iOS/CinemaHUDMobile.xcodeproj \
            -scheme CinemaHUDMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/CinemaHUDMobile.app"
          PACKAGE_PATH="$RUNNER_TEMP/ipa-package"
          test -d "$APP_PATH"
          mkdir -p "$PACKAGE_PATH/Payload"
          cp -R "$APP_PATH" "$PACKAGE_PATH/Payload/"
          (cd "$PACKAGE_PATH" && zip -qry "$GITHUB_WORKSPACE/CinemaHUDMobile-unsigned.ipa" Payload)

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v6
        with:
          name: CinemaHUD-iOS-安装包
          path: CinemaHUDMobile*.ipa
          if-no-files-found: error
          retention-days: 14
