name: CinemaHUDMobile
options:
  bundleIdPrefix: com.shivvyas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CinemaHUD:
    path: ..
targets:
  CinemaHUDMobile:
    type: application
    platform: iOS
    sources:
      - path: CinemaHUDMobile
    dependencies:
      - package: CinemaHUD
        product: SonyCameraKit
      - package: CinemaHUD
        product: CinemaUI
    info:
      path: CinemaHUDMobile/Info.plist
      properties:
        CFBundleDisplayName: CinemaHUD
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: "2.4.1"
        CFBundleVersion: "8"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: false
        NSLocalNetworkUsageDescription: "CinemaHUD 可在本地网络中搜索并控制 Sony 相机或运行 CinemaHUD 的 Mac。"
        NSBonjourServices: ["_cinemahud._tcp"]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.cinemahud.mobile
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
